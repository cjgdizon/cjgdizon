<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Christian James Dizon — Full Stack Developer, System Builder, Consultant">
  <defs>
    <style>
      .sans {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      /* Rotating roles matching portfolio hero-role */
      .role {
        opacity: 0;
        animation: roleCycle 9s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .role-1 { animation-delay: 0s; }
      .role-2 { animation-delay: 3s; }
      .role-3 { animation-delay: 6s; }

      @keyframes roleCycle {
        0% { opacity: 0; transform: translateY(10px); }
        5% { opacity: 1; transform: translateY(0px); }
        28% { opacity: 1; transform: translateY(0px); }
        33.33% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 0; transform: translateY(-10px); }
      }

      /* Gentle floating glass notes */
      .float-1 { animation: floatCard 6.5s ease-in-out infinite; }
      .float-2 { animation: floatCard 7.2s ease-in-out 0.8s infinite; }
      .float-3 { animation: floatCard 6.8s ease-in-out 1.6s infinite; }

      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      /* Pulsing ice-titanium status lights (#d7e5e5) */
      .pulse-dot {
        animation: dotPulse 3s ease-in-out infinite;
      }
      .pulse-dot-2 { animation-delay: 1s; }
      .pulse-dot-3 { animation-delay: 2s; }

      @keyframes dotPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }

      /* Subtle ribbon sheen */
      .ribbon-shimmer {
        animation: sheenShift 10s ease-in-out infinite;
      }
      @keyframes sheenShift {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 0.96; }
      }

      @media (prefers-reduced-motion: reduce) {
        .role, .float-1, .float-2, .float-3, .pulse-dot, .ribbon-shimmer {
          animation: none !important;
        }
        .role-1 { opacity: 1 !important; transform: none !important; }
      }
    </style>

    <clipPath id="frameClip">
      <rect x="0.5" y="0.5" width="1199" height="479" rx="16"/>
    </clipPath>

    <!-- Background subtle radial glows -->
    <radialGradient id="floorGlow" cx="68%" cy="94%" r="48%">
      <stop offset="0%" stop-color="#c4f0f0" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#8ea0a6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="topAmbient" cx="18%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>

    <!-- Sculptural brushed titanium ribbon gradients -->
    <linearGradient id="titaniumOuter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141517"/>
      <stop offset="22%" stop-color="#6c7378"/>
      <stop offset="38%" stop-color="#e4ecee"/>
      <stop offset="52%" stop-color="#3d4145"/>
      <stop offset="74%" stop-color="#8b9296"/>
      <stop offset="90%" stop-color="#222427"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>

    <linearGradient id="titaniumInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a1c"/>
      <stop offset="35%" stop-color="#585e63"/>
      <stop offset="62%" stop-color="#cfd8da"/>
      <stop offset="82%" stop-color="#292b2e"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <linearGradient id="titaniumGoldHint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2922" stop-opacity="0"/>
      <stop offset="48%" stop-color="#a89068" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#d4be96" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titaniumEdge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="68%" stop-color="#d7e5e5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16181a" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0b0c0d" stop-opacity="0.92"/>
    </linearGradient>

    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Main clipped canvas -->
  <g clip-path="url(#frameClip)">
    <!-- Obsidian base -->
    <rect width="1200" height="480" fill="#090909"/>
    <rect width="1200" height="480" fill="url(#topAmbient)"/>
    <rect width="1200" height="480" fill="url(#floorGlow)"/>

    <!-- Subtle architectural grid lines -->
    <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
      <line x1="48" y1="56" x2="48" y2="480"/>
      <line x1="600" y1="56" x2="600" y2="480"/>
      <line x1="1152" y1="56" x2="1152" y2="480"/>
    </g>

    <!-- Sculptural Titanium Ribbon Artwork (evoking portfolio hero-titanium.webp) -->
    <g class="ribbon-shimmer" opacity="0.88">
      <!-- Back lower metallic loop -->
      <path d="M 410 495 C 530 415, 620 260, 775 215 C 945 165, 1135 190, 1235 280 L 1235 370 C 1110 278, 940 250, 795 292 C 670 328, 600 440, 505 495 Z"
            fill="url(#titaniumInner)" opacity="0.58"/>

      <!-- Main sweeping ribbed titanium band -->
      <path d="M 355 495 C 485 385, 585 210, 790 158 C 965 114, 1125 148, 1230 225 L 1230 295 C 1120 220, 965 190, 805 232 C 640 276, 560 415, 450 495 Z"
            fill="url(#titaniumOuter)" opacity="0.92"/>

      <!-- Fine metallic brushed ridges along the sweep -->
      <g fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1">
        <path d="M 378 495 C 502 388, 602 222, 794 172 C 965 128, 1122 162, 1228 238"/>
        <path d="M 392 495 C 514 392, 612 232, 798 184 C 965 141, 1120 174, 1228 250"/>
        <path d="M 406 495 C 526 396, 622 243, 801 196 C 965 154, 1118 187, 1228 263"/>
        <path d="M 420 495 C 538 400, 632 254, 804 208 C 965 167, 1116 200, 1228 276"/>
        <path d="M 434 495 C 550 404, 642 265, 807 220 C 965 180, 1114 212, 1228 288"/>
      </g>

      <!-- Warm champagne-gold inner curve reflection (subtle nod to hero-titanium) -->
      <path d="M 1015 335 C 1075 305, 1125 268, 1168 228 C 1145 278, 1095 322, 1025 352 Z"
            fill="url(#titaniumGoldHint)"/>

      <!-- Foreground twisted lower titanium loop -->
      <path d="M 785 495 C 760 415, 825 340, 945 340 C 1075 340, 1150 405, 1225 465 L 1225 495 L 1065 495 C 1025 445, 965 415, 905 425 C 858 433, 845 462, 855 495 Z"
            fill="url(#titaniumOuter)" opacity="0.88"/>

      <!-- Crisp top specular edge highlight -->
      <path d="M 358 493 C 488 383, 588 208, 790 158 C 965 114, 1125 148, 1228 224"
            fill="none" stroke="url(#titaniumEdge)" stroke-width="1.6"/>
      <path d="M 788 492 C 765 416, 828 342, 945 342 C 1072 342, 1148 405, 1224 464"
            fill="none" stroke="url(#titaniumEdge)" stroke-width="1.2" opacity="0.75"/>
    </g>

    <!-- Soft dark vignette on left for razor-sharp text legibility -->
    <linearGradient id="leftVignette" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090909" stop-opacity="0.96"/>
      <stop offset="52%" stop-color="#090909" stop-opacity="0.72"/>
      <stop offset="72%" stop-color="#090909" stop-opacity="0"/>
    </linearGradient>
    <rect width="1200" height="480" fill="url(#leftVignette)"/>

    <!-- Top Navigation Bar Chrome -->
    <line x1="0" y1="56" x2="1200" y2="56" stroke="#1f1f1f" stroke-width="1"/>
    <!-- Brand Wordmark: cjd. -->
    <text x="48" y="35" class="sans" font-size="20" font-weight="700" letter-spacing="-0.8" fill="#f5f5f5">
      cjd<tspan fill="#7c7c85">.</tspan>
    </text>

    <!-- Subtle Nav Labels -->
    <g class="sans" font-size="12.5" font-weight="400" fill="#888888" text-anchor="middle">
      <text x="505" y="33">Projects</text>
      <text x="572" y="33">About</text>
      <text x="632" y="33">Skills</text>
      <text x="698" y="33">Contact</text>
    </g>

    <!-- Top-Right Status Pill -->
    <g transform="translate(972, 13)">
      <rect width="180" height="30" rx="8" fill="#111114" stroke="#292929" stroke-width="1"/>
      <circle cx="18" cy="15" r="3" fill="#d7e5e5" filter="url(#dotGlow)" class="pulse-dot"/>
      <text x="30" y="19" class="sans" font-size="11.5" font-weight="500" fill="#e6e6e6">Open to internship  ↗</text>
    </g>

    <!-- Left Hero Copy -->
    <g>
      <text x="48" y="148" class="sans" font-size="52" font-weight="600" letter-spacing="-2.4" fill="#f5f5f5">Hi, I'm</text>
      <text x="48" y="204" class="sans" font-size="52" font-weight="600" letter-spacing="-2.4" fill="#f5f5f5">Christian James</text>

      <!-- Animated Role Rotation -->
      <g class="sans" font-size="27" font-weight="500" letter-spacing="-0.8" fill="#a5a5a5">
        <text x="48" y="246" class="role role-1">Full Stack Developer</text>
        <text x="48" y="246" class="role role-2">System Builder</text>
        <text x="48" y="246" class="role role-3">Consultant</text>
      </g>

      <!-- Lead statement -->
      <text x="48" y="286" class="sans" font-size="14.5" font-weight="400" fill="#bdbdbd">Have an idea for your business? I build online stores and</text>
      <text x="48" y="308" class="sans" font-size="14.5" font-weight="400" fill="#bdbdbd">booking systems that make it easier for customers to get things done.</text>

      <!-- Core Stack Label & Chips -->
      <text x="48" y="352" class="mono" font-size="10.5" font-weight="500" letter-spacing="1.4" fill="#7c7c85">TECHNOLOGY STACK</text>

      <g transform="translate(48, 364)" class="mono" font-size="11" fill="#d4d4d4">
        <rect x="0" y="0" width="84" height="26" rx="6" fill="#141414" stroke="#292929"/>
        <text x="42" y="16.5" text-anchor="middle">TypeScript</text>

        <rect x="92" y="0" width="60" height="26" rx="6" fill="#141414" stroke="#292929"/>
        <text x="122" y="16.5" text-anchor="middle">React</text>

        <rect x="160" y="0" width="68" height="26" rx="6" fill="#141414" stroke="#292929"/>
        <text x="194" y="16.5" text-anchor="middle">Next.js</text>

        <rect x="236" y="0" width="72" height="26" rx="6" fill="#141414" stroke="#292929"/>
        <text x="272" y="16.5" text-anchor="middle">Angular</text>

        <rect x="316" y="0" width="96" height="26" rx="6" fill="#141414" stroke="#292929"/>
        <text x="364" y="16.5" text-anchor="middle">Spring Boot</text>

        <rect x="420" y="0" width="92" height="26" rx="6" fill="#141414" stroke="#292929"/>
        <text x="466" y="16.5" text-anchor="middle">PostgreSQL</text>
      </g>
    </g>

    <!-- Right Floating Glass Capability Cards (exact portfolio stagger & copy) -->
    <!-- Card 1: Storefronts -->
    <g class="float-1" filter="url(#cardShadow)">
      <g transform="translate(822, 102)">
        <rect width="232" height="62" rx="10" fill="url(#glassCard)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
        <line x1="12" y1="1" x2="220" y2="1" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
        <circle cx="20" cy="24" r="2.6" fill="#d7e5e5" filter="url(#dotGlow)" class="pulse-dot"/>
        <text x="34" y="28" class="sans" font-size="13" font-weight="500" fill="#e4e4e4">Storefronts</text>
        <text x="34" y="47" class="sans" font-size="11.5" fill="#999999">Catalog  →  checkout</text>
      </g>
    </g>

    <!-- Card 2: Booking systems -->
    <g class="float-2" filter="url(#cardShadow)">
      <g transform="translate(866, 184)">
        <rect width="246" height="62" rx="10" fill="url(#glassCard)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
        <line x1="12" y1="1" x2="234" y2="1" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
        <circle cx="20" cy="24" r="2.6" fill="#d7e5e5" filter="url(#dotGlow)" class="pulse-dot pulse-dot-2"/>
        <text x="34" y="28" class="sans" font-size="13" font-weight="500" fill="#e4e4e4">Booking systems</text>
        <text x="34" y="47" class="sans" font-size="11.5" fill="#999999">Branches  →  appointments</text>
      </g>
    </g>

    <!-- Card 3: Full-stack development -->
    <g class="float-3" filter="url(#cardShadow)">
      <g transform="translate(836, 266)">
        <rect width="256" height="62" rx="10" fill="url(#glassCard)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
        <line x1="12" y1="1" x2="244" y2="1" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
        <circle cx="20" cy="24" r="2.6" fill="#d7e5e5" filter="url(#dotGlow)" class="pulse-dot pulse-dot-3"/>
        <text x="34" y="28" class="sans" font-size="13" font-weight="500" fill="#e4e4e4">Full-stack development</text>
        <text x="34" y="47" class="sans" font-size="11.5" fill="#999999">Interface  →  database</text>
      </g>
    </g>

    <!-- Bottom Signature Strip (matching hero-bottom) -->
    <g transform="translate(48, 422)">
      <rect width="1104" height="36" rx="6" fill="#0d0d0f" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="16" y="22" class="sans" font-size="12" font-weight="400" fill="#cccccc">Design-minded. Built end to end.</text>
      <text x="1088" y="22" class="mono" font-size="11" fill="#888888" text-anchor="end">Mapúa University · B.S. IT · 2024–2027</text>
    </g>
  </g>

  <!-- Crisp outer border -->
  <rect x="0.5" y="0.5" width="1199" height="479" rx="16" fill="none" stroke="#292929" stroke-width="1"/>
</svg>
