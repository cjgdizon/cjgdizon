<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="Christian James Dizon — Design-minded. Built end to end.">
  <defs>
    <style>
      .sans {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .sweep {
        animation: sweepLine 7s ease-in-out infinite;
      }
      @keyframes sweepLine {
        0%, 100% { transform: translateX(-260px); opacity: 0.25; }
        50% { transform: translateX(960px); opacity: 0.9; }
      }
      .pulse {
        animation: dotPulse 3.2s ease-in-out infinite;
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sweep, .pulse { animation: none !important; }
      }
    </style>

    <clipPath id="footerClip">
      <rect x="0.5" y="0.5" width="1199" height="107" rx="14"/>
    </clipPath>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d7e5e5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d7e5e5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d7e5e5" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="footerGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#c4f0f0" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect width="1200" height="108" fill="#090909"/>
    <rect width="1200" height="108" fill="url(#footerGlow)"/>

    <!-- Animated top titanium shimmer hairline -->
    <rect x="0" y="0" width="320" height="1.5" fill="url(#shimmerGrad)" class="sweep"/>

    <!-- Left: Brand mark + tagline -->
    <text x="44" y="48" class="sans" font-size="18" font-weight="700" letter-spacing="-0.6" fill="#f5f5f5">
      Christian James Dizon<tspan fill="#7c7c85">.</tspan>
    </text>
    <text x="44" y="74" class="sans" font-size="12.5" fill="#999999">
      Design-minded. Built end to end.
    </text>

    <!-- Right: Status & copyright -->
    <g>
      <circle cx="1010" cy="41" r="2.8" fill="#d7e5e5" class="pulse"/>
      <text x="1156" y="45" class="mono" font-size="11.5" fill="#d4d4d4" text-anchor="end">github.com/cjgdizon</text>
    </g>
    <text x="1156" y="74" class="mono" font-size="11" fill="#6f6f76" text-anchor="end">
      © 2026 Christian James Dizon · Manila, PH
    </text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="107" rx="14" fill="none" stroke="#292929" stroke-width="1"/>
</svg>
